# 数织 域名配置：nonogram.amiya1223.top

# 域名 HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nonogram.amiya1223.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 域名 HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nonogram.amiya1223.top;

    ssl_certificate /etc/nginx/ssl/nonogram.amiya1223.top.crt;
    ssl_certificate_key /etc/nginx/ssl/nonogram.amiya1223.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 网页源码导入由后端 /api/fetch-url 代理，前端不直连第三方，因此 connect-src 保持 'self'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/nonogram/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 前端
    location / {
        try_files $uri /index.html;
    }
}

# 默认：IP / 未知 Host 直访一律拒绝（大陆服务器仅通过备案域名提供服务）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nonogram.amiya1223.top.crt;
    ssl_certificate_key /etc/nginx/ssl/nonogram.amiya1223.top.key;

    return 444;
}

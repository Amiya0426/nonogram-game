# 数织 域名配置：nonogram.amiya1223.top

# 域名 HTTP -> HTTPS（保留 ACME 挑战路径）
server {
    listen 80;
    listen [::]:80;
    server_name nonogram.amiya1223.top;

    # 证书续期挑战
    location /.well-known/acme-challenge/ {
        root /opt/nonogram/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 域名 HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nonogram.amiya1223.top;

    ssl_certificate /etc/letsencrypt/live/nonogram.amiya1223.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonogram.amiya1223.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /opt/nonogram/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 前端
    location / {
        try_files $uri /index.html;
    }
}

# 默认：IP / 其他 Host 直访
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/nonogram/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}

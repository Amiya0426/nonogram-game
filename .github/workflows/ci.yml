name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit:
    name: Lint + Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  server-smoke:
    name: Server smoke + progress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: smoke-test
        run: cd server && node smoke-test.mjs
      - name: progress-test
        run: cd server && node progress-test.mjs
